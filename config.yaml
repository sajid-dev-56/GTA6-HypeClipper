# ==============================================================================
# GTA6-HypeClipper Pipeline Configuration
# Modular AI-Powered Gaming Livestream to YouTube Shorts Pipeline
# ==============================================================================

# Input Stream / VOD Ingestion Settings
ingest:
  target_resolution: "1080"
  max_fps: 60
  # Select best 1080p60 stream or highest available video under 1080p with best audio
  format_selector: "bestvideo[height<=?1080][fps<=?60]+bestaudio/best[height<=?1080]/best"
  download_chat: true
  audio_sample_rate: 16000 # 16kHz mono PCM for Whisper and RMS analysis
  temp_dir: "temp"
  output_dir: "output"

# Facecam Layout Presets (Assuming standard 1920x1080 source)
# Output Layout: 1080x1920 (9:16 Vertical)
#   - Top 30% (1080x576): Streamer Facecam
#   - Bottom 70% (1080x1344): Main GTA VI Gameplay
layout:
  active_preset: "speed_cam"
  presets:
    speed_cam:
      x: 0
      y: 415
      w: 460
      h: 310
    middle_left_cam:
      x: 0
      y: 415
      w: 460
      h: 310
    middle_right_cam:
      x: 1460
      y: 415
      w: 460
      h: 310
    top_left_cam:
      x: 40
      y: 40
      w: 480
      h: 360
    top_right_cam:
      x: 1400
      y: 40
      w: 480
      h: 360
    bottom_left_cam:
      x: 40
      y: 680
      w: 480
      h: 360
    bottom_right_cam:
      x: 1400
      y: 680
      w: 480
      h: 360
    custom:
      x: 0
      y: 0
      w: 480
      h: 360
  # When preset is 'auto', uses OpenCV face detection across sampled frames
  auto_detect_facecam: true

# Hype Moment Detection Parameters
hype_detection:
  window_seconds: 5.0            # Rolling analysis window
  hop_seconds: 1.0               # Window stride
  audio_threshold_std: 1.8       # Audio spike flag: energy > mean + (1.8 * std)
  min_hype_score: 0.03           # Minimum composite score to qualify as a hype moment
  chat_velocity_weight: 0.5      # Weight of chat velocity in composite score
  audio_spike_weight: 0.5        # Weight of audio volume spike in composite score
  keyword_surge_multiplier: 1.5  # 1.5x boost when chat bursts with hype keywords
  min_clip_spacing_seconds: 45.0 # Prevent overlapping clips
  clip_pre_peak_seconds: 20.0    # 20 seconds before peak
  clip_post_peak_seconds: 28.0   # 28 seconds after peak (Total: 48.0s - Optimal Shorts Retention & Copyright-Safe)
  max_clips: 10                  # Default batch size: 10 viral clips
  hype_keywords:
    - "W"
    - "L"
    - "OMG"
    - "WTF"
    - "CLIP IT"
    - "CLIP"
    - "BRO"
    - "INSANE"
    - "💀"
    - "😂"
    - "HOLY"
    - "SHEESH"
    - "NO WAY"
    - "LETS GO"
    - "LET'S GO"
    - "POG"
    - "POGGERS"
    - "CLUTCH"
    - "CRAZY"
    - "DEAD"
    - "HYPE"
    - "NO SHOT"
    - "UNREAL"
    - "KISS"
    - "KISSING"
    - "ROMANCE"
    - "ROMANTIC"
    - "AYO"
    - "LUCIA"
    - "JASON"
    - "HE KISSED HER"
    - "SHE KISSED HIM"
    - "SMOOCH"
    - "SMACK"
    - "BLUSH"
    - "AYOO"
    - "NAHH"
    - "LOVE"

# Romance, Yacht Party & 18+ Scene Priority (06:30:00 & 08:19:30+)
romance_focus:
  enabled: true
  start_seconds: 23400          # 06:30:00 timestamp
  yacht_seconds: 29970          # 08:19:30 timestamp (Yacht party & Speed shock reactions)
  boost_multiplier: 3.5         # 3.5x boost for viral shock/romance moments to guarantee they get picked

# Hormozi-Style Dynamic Captions Engine
captions:
  enabled: true
  whisper_model: "base"         # base, small, medium, large-v3
  whisper_device: "auto"        # auto, cpu, cuda
  compute_type: "int8"          # int8, float16, float32
  max_words_per_line: 3         # Hormozi punchy phrasing (max 3-4 words)
  font_name: "Montserrat ExtraBold"
  fallback_font_name: "Arial Black"
  font_size: 70
  highlight_font_size: 74
  # Positioned right at the border between Facecam (y: 0-576) and Gameplay (y: 576-1920)
  position_y: 620
  primary_color: "&H00FFFFFF"   # White (&HAABBGGRR in ASS format)
  highlight_color: "&H0000FFFF" # High-energy Neon Yellow (&H0000FFFF)
  outline_color: "&H00000000"   # Deep Black Outline
  outline_width: 6
  shadow_depth: 3
  pop_animation: true           # Dynamic scale pop on active spoken word

# FFmpeg Video Rendering Settings (60fps Single-Pass Pipeline)
video_editor:
  output_width: 1080
  output_height: 1920
  output_fps: 60
  crf: 19
  preset: "veryfast"
  video_codec: "libx264"
  audio_codec: "aac"
  audio_bitrate: "192k"
  ffmpeg_bin: null              # Path to ffmpeg binary (null uses system PATH or auto-find)

# Clip Categorization & Disk Retention Settings
categorization:
  enabled: true
  viral_score_threshold: 1.5   # Hype score >= 1.5 is auto-classified as "BEST" (Viral Potential)
  auto_delete_clips: false     # Never auto-delete clips; user can prune normal clips manually
  save_sidecar_metadata: true  # Saves .meta.json alongside each short

# Optional YouTube Shorts Auto-Uploader (YouTube Data API v3)
uploader:
  enabled: true
  client_secrets_file: "client_secrets.json"
  token_file: "token.json"
  privacy_status: "public"      # unlisted, public, private
  category_id: "20"             # 20 = Gaming
  auto_cleanup_uploaded: false  # KEEP all clips on disk! Do not auto-delete.
  viral_only: true              # Strict filter: only upload top-tier hype clips (no boring moments)
  max_uploads_per_run: 2        # Upload only top 1-2 highest viral potential clips per cycle
  default_tags:
    - "GTA6"
    - "GTAVI"
    - "GrandTheftAuto6"
    - "GTA6Gameplay"
    - "GamingShorts"
    - "Shorts"
    - "YouTubeShorts"
    - "TwitchClips"
